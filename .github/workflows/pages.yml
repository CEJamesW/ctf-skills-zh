---
name: 部署技能目录到 GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建目录
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 安装依赖
        run: pip install markdown

      - name: 生成目录
        run: python scripts/generate_catalog.py

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 部署到 Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
