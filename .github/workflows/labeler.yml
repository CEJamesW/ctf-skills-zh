---
name: 标签器

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: 自动标记 PR
    runs-on: ubuntu-latest
    steps:
      - name: 根据变更文件标记 PR
        uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
