---
name: 脚本代码检查

'on':
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/lint-scripts.yml'
  workflow_dispatch:

concurrency:
  group: lint-scripts-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 签出代码
        uses: actions/checkout@v6

      - name: 运行 ShellCheck
        run: shellcheck scripts/*.sh

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 签出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 安装 Ruff
        run: pip install ruff

      - name: Ruff 检查
        run: ruff check scripts/

      - name: Ruff 格式检查
        run: ruff format --check scripts/
